<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0b2427;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const FRAME_COUNT = 253;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const images = new Array(FRAME_COUNT);

let currentFrame = 0;


/* =========================
   圖片網址
========================= */

function getFrameURL(index) {

  return "./frames/frame_" +
    String(index).padStart(4, "0") +
    ".webp";

}


/* =========================
   Canvas 尺寸
========================= */

function resizeCanvas() {

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width =
    Math.round(window.innerWidth * dpr);

  canvas.height =
    Math.round(window.innerHeight * dpr);

  if (images[currentFrame]) {
    drawFrame(currentFrame);
  }

}


/* =========================
   畫面 COVER
========================= */

function drawFrame(index) {

  const img = images[index];

  if (!img) return;

  currentFrame = index;

  const cw = canvas.width;
  const ch = canvas.height;

  const scale = Math.max(
    cw / img.naturalWidth,
    ch / img.naturalHeight
  );

  const w = img.naturalWidth * scale;
  const h = img.naturalHeight * scale;

  const x = (cw - w) / 2;
  const y = (ch - h) / 2;

  ctx.clearRect(0, 0, cw, ch);

  ctx.drawImage(
    img,
    x,
    y,
    w,
    h
  );

}


/* =========================
   載入單張
========================= */

function loadFrame(index) {

  if (
    index < 0 ||
    index >= FRAME_COUNT
  ) return;

  if (images[index]) return;

  const img = new Image();

  img.onload = function () {

    images[index] = img;

    if (index === currentFrame) {
      drawFrame(index);
    }

  };

  img.onerror = function () {
    console.error(
      "Frame failed:",
      getFrameURL(index)
    );
  };

  img.src = getFrameURL(index);

}


/* =========================
   初始化
========================= */

resizeCanvas();

/* 最重要：
   第一張先單獨載入 */
loadFrame(0);


/* =========================
   預載其他圖片
========================= */

setTimeout(() => {

  for (
    let i = 1;
    i < FRAME_COUNT;
    i++
  ) {

    setTimeout(() => {
      loadFrame(i);
    }, i * 8);

  }

}, 200);


/* =========================
   接收 Wix 指令
========================= */

window.addEventListener(
  "message",
  function(event) {

    let data = event.data;

    if (
      data &&
      data.data &&
      typeof data.data === "object"
    ) {
      data = data.data;
    }

    if (
      !data ||
      data.type !== "scrollProgress"
    ) return;

    let progress =
      Number(data.progress);

    if (!Number.isFinite(progress))
      return;

    progress =
      Math.max(
        0,
        Math.min(1, progress)
      );

    const frame =
      Math.round(
        progress *
        (FRAME_COUNT - 1)
      );

    currentFrame = frame;

    if (images[frame]) {

      drawFrame(frame);

    } else {

      loadFrame(frame);

    }

  }
);


/* =========================
   Resize
========================= */

window.addEventListener(
  "resize",
  resizeCanvas
);

</script>

</body>
</html>
