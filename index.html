
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ONDA PRO Scroll Animation</title>

  <style>
    :root {
      /* 必須與 Wix 區段的背景色相同 */
      --background: #153336;

      /* 左右各 8% 輕微羽化 */
      --feather-width: 8%;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--background);
    }

    body {
      position: relative;
    }

    /* 動畫畫布 */
    #animation {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 左右羽化 */
    #left-feather,
    #right-feather {
      position: absolute;
      top: 0;
      bottom: 0;
      width: var(--feather-width);
      z-index: 2;
      pointer-events: none;
    }

    #left-feather {
      left: 0;

      background: linear-gradient(
        to right,
        #153336 0%,
        rgba(21, 51, 54, 0) 100%
      );
    }

    #right-feather {
      right: 0;

      background: linear-gradient(
        to left,
        #153336 0%,
        rgba(21, 51, 54, 0) 100%
      );
    }
  </style>
</head>

<body>

  <canvas id="animation"></canvas>

  <div id="left-feather"></div>
  <div id="right-feather"></div>

  <script>
    const FRAME_COUNT = 253;

    const canvas = document.getElementById("animation");
    const ctx = canvas.getContext("2d");

    const images = new Array(FRAME_COUNT);
    const loading = new Set();

    let requestedFrame = 0;
    let displayedFrame = -1;

    /*
      圖片編號：
      frame_0001.webp ～ frame_0253.webp
    */
    function getFrameURL(index) {
      const number = String(index + 1).padStart(4, "0");

      return `./frames/frame_${number}.webp`;
    }

    /*
      自動調整 Canvas 尺寸
    */
    function resizeCanvas() {
      const dpr = Math.min(
        window.devicePixelRatio || 1,
        2
      );

      canvas.width = Math.round(
        window.innerWidth * dpr
      );

      canvas.height = Math.round(
        window.innerHeight * dpr
      );

      if (displayedFrame >= 0) {
        drawFrame(displayedFrame);
      }
    }

    /*
      使用 cover 模式顯示動畫
    */
    function drawFrame(index) {
      const img = images[index];

      if (
        !img ||
        !img.complete ||
        !img.naturalWidth
      ) {
        return;
      }

      const cw = canvas.width;
      const ch = canvas.height;

      const scale = Math.max(
        cw / img.naturalWidth,
        ch / img.naturalHeight
      );

      const width = img.naturalWidth * scale;
      const height = img.naturalHeight * scale;

      const x = (cw - width) / 2;
      const y = (ch - height) / 2;

      ctx.clearRect(0, 0, cw, ch);

      ctx.drawImage(
        img,
        x,
        y,
        width,
        height
      );

      displayedFrame = index;
    }

    /*
      載入指定影格
    */
    function loadFrame(index) {
      if (
        index < 0 ||
        index >= FRAME_COUNT
      ) {
        return;
      }

      if (
        images[index] ||
        loading.has(index)
      ) {
        return;
      }

      loading.add(index);

      const img = new Image();

      img.onload = function () {
        loading.delete(index);

        images[index] = img;

        if (index === requestedFrame) {
          drawFrame(index);
        }
      };

      img.onerror = function () {
        loading.delete(index);

        console.error(
          "ONDA 圖片載入失敗：",
          getFrameURL(index)
        );
      };

      img.src = getFrameURL(index);
    }

    /*
      控制動畫正放與倒放
    */
    function setProgress(value) {
      const progress = Number(value);

      if (!Number.isFinite(progress)) {
        return;
      }

      const clamped = Math.max(
        0,
        Math.min(1, progress)
      );

      requestedFrame = Math.round(
        clamped * (FRAME_COUNT - 1)
      );

      if (images[requestedFrame]) {
        drawFrame(requestedFrame);
      } else {
        loadFrame(requestedFrame);
      }

      // 優先載入目前影格附近的圖片
      for (let offset = -5; offset <= 5; offset++) {
        loadFrame(requestedFrame + offset);
      }
    }

    /*
      Wix 控制動畫淡入、淡出
    */
    function setOpacity(value) {
      const opacity = Number(value);

      if (!Number.isFinite(opacity)) {
        return;
      }

      document.body.style.opacity = String(
        Math.max(0, Math.min(1, opacity))
      );
    }

    /*
      接收 Wix Velo 訊息
    */
    window.addEventListener("message", function (event) {
      let data = event.data;

      // 相容 Wix 的巢狀訊息格式
      if (
        data &&
        data.data &&
        typeof data.data === "object"
      ) {
        data = data.data;
      }

      if (!data || !data.type) {
        return;
      }

      if (data.type === "scrollProgress") {
        setProgress(data.progress);
      }

      if (data.type === "setOpacity") {
        setOpacity(data.opacity);
      }
    });

    /*
      背景預載圖片
      每批 8 張，避免同時發送大量請求
    */
    function preloadFrames() {
      let nextFrame = 1;

      function loadBatch() {
        const end = Math.min(
          nextFrame + 8,
          FRAME_COUNT
        );

        for (let i = nextFrame; i < end; i++) {
          loadFrame(i);
        }

        nextFrame = end;

        if (nextFrame < FRAME_COUNT) {
          setTimeout(loadBatch, 100);
        }
      }

      setTimeout(loadBatch, 200);
    }

    /*
      初始化
    */
    window.addEventListener(
      "resize",
      resizeCanvas
    );

    resizeCanvas();
    loadFrame(0);
    preloadFrames();
  </script>

</body>
</html>
