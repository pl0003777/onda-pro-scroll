
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ONDA PRO Scroll Animation</title>

  <style>
    :root {
      /* 改成 Wix 區段實際使用的背景色 */
      --background: #153336;

      /* 左右羽化寬度 */
      --feather-width: 22%;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--background);
    }

    body {
      position: relative;
    }

    #animation {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /*
      左右漸層遮罩：
      使用與 Wix 相同的背景色，
      避免 iframe 透明度限制。
    */

    #left-feather,
    #right-feather {
      position: absolute;
      top: 0;
      bottom: 0;
      width: var(--feather-width);
      z-index: 2;
      pointer-events: none;
    }

    #left-feather {
      left: 0;

      background: linear-gradient(
        to right,
        var(--background) 0%,
        rgba(21, 51, 54, 0.95) 15%,
        rgba(21, 51, 54, 0.65) 45%,
        rgba(21, 51, 54, 0) 100%
      );
    }

    #right-feather {
      right: 0;

      background: linear-gradient(
        to left,
        var(--background) 0%,
        rgba(21, 51, 54, 0.95) 15%,
        rgba(21, 51, 54, 0.65) 45%,
        rgba(21, 51, 54, 0) 100%
      );
    }
  </style>
</head>

<body>

  <canvas id="animation"></canvas>

  <div id="left-feather"></div>
  <div id="right-feather"></div>

  <script>
    const FRAME_COUNT = 253;

    const canvas = document.getElementById(
      "animation"
    );

    const ctx = canvas.getContext("2d");

    const images = new Array(FRAME_COUNT);

    const loading = new Set();

    let requestedFrame = 0;
    let displayedFrame = -1;

    let currentOpacity = 1;

    /*
      圖片路徑：
      frame_0001.webp ～ frame_0253.webp
    */

    function getFrameURL(index) {
      const number = String(index + 1)
        .padStart(4, "0");

      return `./frames/frame_${number}.webp`;
    }

    /*
      Canvas 尺寸
    */

    function resizeCanvas() {
      const dpr = Math.min(
        window.devicePixelRatio || 1,
        2
      );

      canvas.width = Math.round(
        window.innerWidth * dpr
      );

      canvas.height = Math.round(
        window.innerHeight * dpr
      );

      if (displayedFrame >= 0) {
        drawFrame(displayedFrame);
      }
    }

    /*
      圖片以 cover 方式填滿播放器
    */

    function drawFrame(index) {
      const img = images[index];

      if (
        !img ||
        !img.complete ||
        !img.naturalWidth
      ) {
        return;
      }

      const cw = canvas.width;
      const ch = canvas.height;

      const scale = Math.max(
        cw / img.naturalWidth,
        ch / img.naturalHeight
      );

      const width = img.naturalWidth * scale;
      const height = img.naturalHeight * scale;

      const x = (cw - width) / 2;
      const y = (ch - height) / 2;

      ctx.clearRect(0, 0, cw, ch);

      ctx.drawImage(
        img,
        x,
        y,
        width,
        height
      );

      displayedFrame = index;
    }

    /*
      載入單張圖片
    */

    function loadFrame(index) {
      if (
        index < 0 ||
        index >= FRAME_COUNT
      ) {
        return;
      }

      if (
        images[index] ||
        loading.has(index)
      ) {
        return;
      }

      loading.add(index);

      const img = new Image();

      img.onload = function () {
        loading.delete(index);

        images[index] = img;

        if (index === requestedFrame) {
          drawFrame(index);
        }
      };

      img.onerror = function () {
        loading.delete(index);

        console.error(
          "圖片載入失敗：",
          getFrameURL(index)
        );
      };

      img.src = getFrameURL(index);
    }

    /*
      根據 Wix 捲動進度切換影格
    */

    function setProgress(value) {
      const progress = Number(value);

      if (!Number.isFinite(progress)) {
        return;
      }

      const clamped = Math.max(
        0,
        Math.min(1, progress)
      );

      requestedFrame = Math.round(
        clamped * (FRAME_COUNT - 1)
      );

      if (images[requestedFrame]) {
        drawFrame(requestedFrame);
      } else {
        loadFrame(requestedFrame);
      }

      // 優先載入目前影格附近的圖片
      for (let offset = -5; offset <= 5; offset++) {
        loadFrame(requestedFrame + offset);
      }
    }

    /*
      控制整個動畫淡入、淡出
    */

    function setOpacity(value) {
      const opacity = Number(value);

      if (!Number.isFinite(opacity)) {
        return;
      }

      currentOpacity = Math.max(
        0,
        Math.min(1, opacity)
      );

      document.body.style.opacity =
        String(currentOpacity);
    }

    /*
      接收 Wix Velo 訊息
    */

    window.addEventListener(
      "message",
      function (event) {
        let data = event.data;

        // 相容部分 Wix 訊息包裝格式
        if (
          data &&
          data.data &&
          typeof data.data === "object"
        ) {
          data = data.data;
        }

        if (!data || !data.type) {
          return;
        }

        if (data.type === "scrollProgress") {
          setProgress(data.progress);
        }

        if (data.type === "setOpacity") {
          setOpacity(data.opacity);
        }
      }
    );

    /*
      背景預載：
      每批載入 8 張，避免一次發送
      253 個圖片請求。
    */

    function preloadFrames() {
      let nextFrame = 1;

      function loadBatch() {
        const end = Math.min(
          nextFrame + 8,
          FRAME_COUNT
        );

        for (
          let i = nextFrame;
          i < end;
          i++
        ) {
          loadFrame(i);
        }

        nextFrame = end;

        if (nextFrame < FRAME_COUNT) {
          setTimeout(loadBatch, 100);
        }
      }

      setTimeout(loadBatch, 200);
    }

    /*
      啟動
    */

    window.addEventListener(
      "resize",
      resizeCanvas
    );

    resizeCanvas();

    loadFrame(0);

    preloadFrames();
  </script>

</body>
</html>
