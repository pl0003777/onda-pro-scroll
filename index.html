<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>ONDA PRO Scroll Sequence</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#0a1115}
  body{height:520vh}
  #stage{position:sticky;top:0;width:100%;height:100vh;overflow:hidden;background:#0a1115}
  canvas{display:block;width:100%;height:100%;}
  #loading{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:12px/1.4 Arial,sans-serif;letter-spacing:.12em;background:#0a1115;transition:opacity .35s;pointer-events:none}
  #loading.hide{opacity:0}
</style>
</head>
<body>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="loading">LOADING ONDA PRO</div>
  </div>
<script>
(() => {
  const FRAME_COUNT = 253;
  const FRAME_DIR = 'frames/';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha:false });
  const loading = document.getElementById('loading');
  const images = new Array(FRAME_COUNT);
  let current = -1, target = 0, raf = 0;

  const src = i => `${FRAME_DIR}frame_${String(i+1).padStart(4,'0')}.webp`;

  function fitCanvas(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(innerWidth*dpr), h = Math.round(innerHeight*dpr);
    if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; draw(current<0?0:current); }
  }
  function draw(i){
    const img = images[i]; if(!img || !img.complete) return;
    const cw=canvas.width,ch=canvas.height, ir=img.naturalWidth/img.naturalHeight, cr=cw/ch;
    let sw,sh,sx,sy;
    if(ir>cr){ sh=img.naturalHeight; sw=sh*cr; sx=(img.naturalWidth-sw)/2; sy=0; }
    else { sw=img.naturalWidth; sh=sw/cr; sx=0; sy=(img.naturalHeight-sh)/2; }
    ctx.drawImage(img,sx,sy,sw,sh,0,0,cw,ch);
  }
  function animate(){
    raf=0;
    if(current!==target){ current += Math.sign(target-current); draw(current); raf=requestAnimationFrame(animate); }
  }
  function update(){
    const max=document.documentElement.scrollHeight-innerHeight;
    const p=max>0?Math.min(1,Math.max(0,scrollY/max)):0;
    target=Math.round(p*(FRAME_COUNT-1));
    if(!raf) raf=requestAnimationFrame(animate);
  }
  function load(i){
    return new Promise(resolve=>{
      const im=new Image(); images[i]=im; im.onload=resolve; im.onerror=resolve; im.src=src(i);
    });
  }
  async function init(){
    await load(0); current=0; draw(0); loading.classList.add('hide');
    // Load every 8th frame first for quick scrubbing, then fill all frames.
    const priority=[]; for(let i=8;i<FRAME_COUNT;i+=8) priority.push(load(i));
    await Promise.all(priority);
    const rest=[]; for(let i=1;i<FRAME_COUNT;i++) if(!images[i]) rest.push(load(i));
    Promise.all(rest).then(update);
  }
  addEventListener('resize',fitCanvas,{passive:true});
  addEventListener('scroll',update,{passive:true});
  fitCanvas(); init(); update();
})();
</script>
</body>
</html>
