<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b2427;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

/* =========================
   基本設定
========================= */

const FRAME_COUNT = 253;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const images = new Array(FRAME_COUNT);

let currentFrame = 0;


/* =========================
   圖片網址

   程式 index 0
   = frame_0001.webp

   程式 index 252
   = frame_0253.webp
========================= */

function getFrameURL(index) {

  return "./frames/frame_" +
    String(index + 1).padStart(4, "0") +
    ".webp";

}


/* =========================
   Canvas 尺寸
========================= */

function resizeCanvas() {

  const dpr = Math.min(
    window.devicePixelRatio || 1,
    2
  );

  canvas.width =
    Math.round(window.innerWidth * dpr);

  canvas.height =
    Math.round(window.innerHeight * dpr);

  if (images[currentFrame]) {
    drawFrame(currentFrame);
  }

}


/* =========================
   繪製圖片
   使用 COVER 模式
========================= */

function drawFrame(index) {

  const img = images[index];

  if (!img) return;

  currentFrame = index;

  const cw = canvas.width;
  const ch = canvas.height;

  const scale = Math.max(
    cw / img.naturalWidth,
    ch / img.naturalHeight
  );

  const width =
    img.naturalWidth * scale;

  const height =
    img.naturalHeight * scale;

  const x =
    (cw - width) / 2;

  const y =
    (ch - height) / 2;

  ctx.clearRect(
    0,
    0,
    cw,
    ch
  );

  ctx.drawImage(
    img,
    x,
    y,
    width,
    height
  );

}


/* =========================
   載入單張圖片
========================= */

function loadFrame(index) {

  if (
    index < 0 ||
    index >= FRAME_COUNT
  ) {
    return;
  }

  if (images[index]) {
    return;
  }

  const img = new Image();

  img.onload = function () {

    images[index] = img;

    if (index === currentFrame) {
      drawFrame(index);
    }

  };

  img.onerror = function () {

    console.error(
      "Frame failed:",
      getFrameURL(index)
    );

  };

  img.src =
    getFrameURL(index);

}


/* =========================
   初始化 Canvas
========================= */

resizeCanvas();


/* =========================
   第一張優先載入

   index 0
   實際就是：
   frame_0001.webp
========================= */

loadFrame(0);


/* =========================
   背景預載其他 252 張
========================= */

setTimeout(() => {

  for (
    let i = 1;
    i < FRAME_COUNT;
    i++
  ) {

    setTimeout(() => {

      loadFrame(i);

    }, i * 8);

  }

}, 200);


/* =========================
   接收 Wix 傳來的
   Scroll Progress

   progress:
   0   = 第一張
   0.5 = 中間
   1   = 最後一張
========================= */

window.addEventListener(
  "message",
  function(event) {

    let data =
      event.data;

    /*
      Wix 有時候會把訊息
      包在 data 裡面
    */

    if (
      data &&
      typeof data === "object" &&
      data.data &&
      typeof data.data === "object"
    ) {

      data =
        data.data;

    }


    if (
      !data ||
      data.type !== "scrollProgress"
    ) {

      return;

    }


    let progress =
      Number(data.progress);


    if (
      !Number.isFinite(progress)
    ) {

      return;

    }


    progress =
      Math.max(
        0,
        Math.min(
          1,
          progress
        )
      );


    const frame =
      Math.round(
        progress *
        (FRAME_COUNT - 1)
      );


    currentFrame =
      frame;


    /*
      如果這一格已經載好
      直接畫出來
    */

    if (images[frame]) {

      drawFrame(frame);

    }

    /*
      還沒載好
      就立刻載入
    */

    else {

      loadFrame(frame);

    }


    /*
      順便預載目前畫面
      前後幾格
    */

    for (
      let offset = -4;
      offset <= 4;
      offset++
    ) {

      loadFrame(
        frame + offset
      );

    }

  }
);


/* =========================
   視窗尺寸改變
========================= */

window.addEventListener(
  "resize",
  resizeCanvas
);

</script>

</body>
</html>
