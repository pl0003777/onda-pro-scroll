
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #0b2427;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>

<body>
<canvas id="canvas"></canvas>

<script>
const FRAME_COUNT = 253;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const images = new Array(FRAME_COUNT);
const loading = new Set();

let requestedFrame = 0;
let displayedFrame = -1;

function frameURL(index) {
  return "./frames/frame_" +
    String(index + 1).padStart(4, "0") +
    ".webp";
}

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.round(window.innerWidth * dpr);
  canvas.height = Math.round(window.innerHeight * dpr);

  if (displayedFrame >= 0) {
    drawFrame(displayedFrame);
  }
}

function drawFrame(index) {
  const img = images[index];

  if (!img || !img.complete || !img.naturalWidth) {
    return;
  }

  const cw = canvas.width;
  const ch = canvas.height;

  const scale = Math.max(
    cw / img.naturalWidth,
    ch / img.naturalHeight
  );

  const width = img.naturalWidth * scale;
  const height = img.naturalHeight * scale;

  const x = (cw - width) / 2;
  const y = (ch - height) / 2;

  ctx.clearRect(0, 0, cw, ch);
  ctx.drawImage(img, x, y, width, height);

  displayedFrame = index;
}

function loadFrame(index) {
  if (index < 0 || index >= FRAME_COUNT) return;
  if (images[index] || loading.has(index)) return;

  loading.add(index);

  const img = new Image();

  img.onload = function () {
    loading.delete(index);
    images[index] = img;

    // 只顯示目前真正需要的畫面
    if (index === requestedFrame) {
      drawFrame(index);
    }
  };

  img.onerror = function () {
    loading.delete(index);
    console.error("圖片載入失敗：", frameURL(index));
  };

  img.src = frameURL(index);
}

function setProgress(progress) {
  const value = Math.max(0, Math.min(1, Number(progress)));

  if (!Number.isFinite(value)) return;

  requestedFrame = Math.round(value * (FRAME_COUNT - 1));

  if (images[requestedFrame]) {
    drawFrame(requestedFrame);
  } else {
    // 保留上一張畫面，直到新圖片載入完成
    loadFrame(requestedFrame);
  }

  // 預載目前畫面附近的圖片
  for (let offset = -5; offset <= 5; offset++) {
    loadFrame(requestedFrame + offset);
  }
}

// 接收 Wix 的控制訊息
window.addEventListener("message", function (event) {
  let data = event.data;

  if (
    data &&
    typeof data === "object" &&
    data.data &&
    typeof data.data === "object"
  ) {
    data = data.data;
  }

  if (!data || data.type !== "scrollProgress") return;

  setProgress(data.progress);
});

window.addEventListener("resize", resizeCanvas);

// 先設定 Canvas 尺寸，再載入第一張
resizeCanvas();
loadFrame(0);

// 背景預載其餘圖片
let preloadIndex = 1;

function preloadBatch() {
  const end = Math.min(preloadIndex + 8, FRAME_COUNT);

  for (let i = preloadIndex; i < end; i++) {
    loadFrame(i);
  }

  preloadIndex = end;

  if (preloadIndex < FRAME_COUNT) {
    setTimeout(preloadBatch, 80);
  }
}

setTimeout(preloadBatch, 200);
</script>
</body>
</html>
