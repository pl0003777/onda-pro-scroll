<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #0b2427;
  }

  #canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const FRAME_COUNT = 253;
const FRAME_PATH = "./frames/";
const FRAME_PREFIX = "frame_";
const FRAME_EXTENSION = ".webp";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const images = new Array(FRAME_COUNT);

let currentFrame = 0;
let requestedFrame = 0;
let firstFrameReady = false;


/* -----------------------------
   Frame filename
----------------------------- */

function frameURL(index) {
  return (
    FRAME_PATH +
    FRAME_PREFIX +
    String(index).padStart(4, "0") +
    FRAME_EXTENSION
  );
}


/* -----------------------------
   Load frames
----------------------------- */

function loadFrame(index) {
  if (index < 0 || index >= FRAME_COUNT) return;

  if (images[index]) return;

  const img = new Image();

  img.onload = () => {
    images[index] = img;

    if (index === 0 && !firstFrameReady) {
      firstFrameReady = true;
      drawFrame(0);
    }

    if (index === requestedFrame) {
      drawFrame(index);
    }
  };

  img.src = frameURL(index);
}


/* -----------------------------
   Preload
----------------------------- */

loadFrame(0);

/* 先載入前面幾格，讓首屏快速出現 */
for (let i = 1; i < Math.min(20, FRAME_COUNT); i++) {
  loadFrame(i);
}

/* 背景慢慢把剩下的載完 */
let preloadIndex = 20;

function preloadNext() {
  if (preloadIndex >= FRAME_COUNT) return;

  const end = Math.min(preloadIndex + 10, FRAME_COUNT);

  for (let i = preloadIndex; i < end; i++) {
    loadFrame(i);
  }

  preloadIndex = end;

  setTimeout(preloadNext, 40);
}

preloadNext();


/* -----------------------------
   Canvas sizing
----------------------------- */

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.round(window.innerWidth * dpr);
  canvas.height = Math.round(window.innerHeight * dpr);

  drawFrame(currentFrame);
}

window.addEventListener("resize", resizeCanvas);


/* -----------------------------
   Draw image using COVER
----------------------------- */

function drawFrame(index) {
  const img = images[index];

  if (!img || !img.complete) {
    loadFrame(index);
    return;
  }

  currentFrame = index;

  const cw = canvas.width;
  const ch = canvas.height;

  const scale = Math.max(
    cw / img.naturalWidth,
    ch / img.naturalHeight
  );

  const width = img.naturalWidth * scale;
  const height = img.naturalHeight * scale;

  const x = (cw - width) / 2;
  const y = (ch - height) / 2;

  ctx.clearRect(0, 0, cw, ch);
  ctx.drawImage(img, x, y, width, height);
}


/* -----------------------------
   Receive scroll progress
   from Wix
----------------------------- */

window.addEventListener("message", (event) => {
  let data = event.data;

  /* Wix HTML Component 有時會包在 data 裡 */
  if (
    data &&
    typeof data === "object" &&
    data.data &&
    typeof data.data === "object"
  ) {
    data = data.data;
  }

  if (!data || data.type !== "scrollProgress") return;

  let progress = Number(data.progress);

  if (!Number.isFinite(progress)) return;

  progress = Math.max(0, Math.min(1, progress));

  requestedFrame = Math.round(
    progress * (FRAME_COUNT - 1)
  );

  /* 優先確保目前需要的格數有載入 */
  loadFrame(requestedFrame);

  /* 同時預載附近畫面 */
  for (let offset = -3; offset <= 3; offset++) {
    loadFrame(requestedFrame + offset);
  }

  drawFrame(requestedFrame);
});


/* -----------------------------
   Tell parent we're ready
----------------------------- */

window.parent.postMessage(
  {
    type: "ondaReady"
  },
  "*"
);

resizeCanvas();

</script>

</body>
</html>
